name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:prose
      - run: npm run build
      - run: npm run build:portable
      - name: Validate release tag
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const expected = 'v' + JSON.parse(fs.readFileSync('package.json', 'utf8')).version; if (process.env.GITHUB_REF_NAME !== expected) throw new Error('Release tag does not match package.json version (expected ' + expected + ')');"
      - run: npm run verify:parity
      - name: Verify gzipped web bundle size
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import zlib from 'node:zlib'; import path from 'node:path'; const dir='dist/assets'; const bytes=fs.readdirSync(dir).filter((n)=>/\.m?js$/.test(n)||n.endsWith('.css')).reduce((n,f)=>n+zlib.gzipSync(fs.readFileSync(path.join(dir,f))).length,0); console.log('Gzipped JS+CSS:',bytes,'bytes'); if(bytes>=300*1024) throw new Error('Gzipped JS+CSS bundle is 300 KB or larger');"
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/portable.spec.ts
      - run: npm pack --pack-destination dist-portable
      - name: Generate SHA256SUMS
        run: |
          cd dist-portable
          sha256sum graticule-portable.html *.tgz > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Graticule ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist-portable/graticule-portable.html
            dist-portable/*.tgz
            dist-portable/SHA256SUMS.txt
