name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:prose
      - run: npm run build
      - run: npm run build:portable
      - run: npm pack --pack-destination dist-portable
      - name: Generate SHA256SUMS
        run: |
          cd dist-portable
          sha256sum graticule-portable.html *.tgz > SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Graticule ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist-portable/graticule-portable.html
            dist-portable/*.tgz
            dist-portable/SHA256SUMS.txt
