name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      - run: npm run typecheck
        timeout-minutes: 5
      - run: npm test
        timeout-minutes: 10
      - run: npm run check:prose
        timeout-minutes: 5
      - run: npm run build
        timeout-minutes: 10
      - run: npm run build:portable
        timeout-minutes: 10
      - run: npm run check:bundle -- --portable
        timeout-minutes: 5
      - run: npm run verify:parity
        timeout-minutes: 5
      - run: npm pack --dry-run --ignore-scripts
        timeout-minutes: 5
      - name: Install Playwright Chromium
        run: |
          npx playwright install --with-deps chromium
        timeout-minutes: 10
      - run: npm run test:e2e
        timeout-minutes: 10

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      - run: npm run typecheck
        timeout-minutes: 5
      - run: npm test
        timeout-minutes: 10
      - run: npm run build
        timeout-minutes: 10
      - run: npm run build:portable
        timeout-minutes: 10
      - run: npm run check:bundle -- --portable
        timeout-minutes: 5
      - run: npm run verify:parity
        timeout-minutes: 5
      - run: npm pack --dry-run --ignore-scripts
        timeout-minutes: 5
